name: Rover 4.7.2 dual ESC OSD

on:
  workflow_dispatch:

permissions:
  contents: read
щ
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Fetch ArduPilot Rover 4.7.2
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --branch Rover-4.7.2 \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/ArduPilot/ardupilot.git \
            upstream

          test "$(git -C upstream rev-parse --short=8 HEAD)" = "fb773567"

          echo "Upstream commit:"
          git -C upstream log -1 --oneline

      - name: Install build prerequisites
        shell: bash
        env:
          SKIP_AP_EXT_ENV: "1"
          SKIP_AP_GRAPHIC_ENV: "1"
          SKIP_AP_GIT_CHECK: "1"
        run: |
          set -euo pipefail
          upstream/Tools/environment_install/install-prereqs-ubuntu.sh -y

      - name: Apply dual ESC OSD patch
        shell: bash
        run: |
          set -euo pipefail

          test -f tools/patch_dual_esc.py

          python3 tools/patch_dual_esc.py upstream

          sed -i 's/[[:blank:]]*$//' \
            upstream/libraries/AP_OSD/AP_OSD_Screen.cpp \
            upstream/libraries/AP_OSD/AP_OSD.h

          git -C upstream diff --check

          mkdir -p artifacts
          git -C upstream diff > artifacts/dual-esc.patch

          test -s artifacts/dual-esc.patch

      - name: Compile Rover firmware
        shell: bash
        run: |
          set -euo pipefail

          source ~/.profile
          cd upstream

          ./waf configure --board Pixhawk1-1M-bdshot
          ./waf rover -j2

          cp build/Pixhawk1-1M-bdshot/bin/ardurover.apj \
            ../artifacts/ardurover.apj

          cp build/Pixhawk1-1M-bdshot/bin/ardurover \
            ../artifacts/ardurover.elf

      - name: Validate APJ and record build
        shell: bash
        run: |
          set -euo pipefail

          test -s artifacts/ardurover.apj
          test -s artifacts/ardurover.elf

          python3 - <<'PY'
          import base64
          import json
          import zlib
          from pathlib import Path

          path = Path("artifacts/ardurover.apj")

          try:
              apj = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as e:
              raise SystemExit(f"Invalid APJ JSON: {e}")

          required = ("board_id", "image", "image_size")
          missing = [key for key in required if key not in apj]
          if missing:
              raise SystemExit(
                  "Invalid APJ: missing fields: " + ", ".join(missing)
              )

          if not isinstance(apj["image"], str) or not apj["image"]:
              raise SystemExit("Invalid APJ: 'image' is empty")

          try:
              image = zlib.decompress(
                  base64.b64decode(apj["image"], validate=True)
              )
          except Exception as e:
              raise SystemExit(f"Invalid APJ image payload: {e}")

          expected_size = int(apj["image_size"])
          actual_size = len(image)

          if expected_size <= 0:
              raise SystemExit(
                  f"Invalid APJ: image_size must be positive, got {expected_size}"
              )

          if actual_size != expected_size:
              raise SystemExit(
                  f"Invalid APJ: image_size={expected_size}, "
                  f"decoded_size={actual_size}"
              )

          print(f"APJ valid: board_id={apj['board_id']}")
          print(f"APJ decoded image size={actual_size} bytes")

          for key in (
              "board_revision",
              "platform",
              "git_identity",
              "magic",
              "description",
              "summary",
          ):
              if key in apj:
                  print(f"APJ {key}={apj[key]}")
          PY

          git -C upstream rev-parse HEAD > artifacts/upstream-commit.txt

          git -C upstream describe --always --tags --dirty \
            > artifacts/upstream-describe.txt

          sha256sum artifacts/ardurover.apj artifacts/ardurover.elf \
            > artifacts/SHA256SUMS.txt
