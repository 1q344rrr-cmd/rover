name: Rover 4.7.2 dual ESC OSD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream
        run: |
          git clone --branch Rover-4.7.2 --depth 1 --recurse-submodules --shallow-submodules https://github.com/ArduPilot/ardupilot.git upstream
          test "$(git -C upstream rev-parse --short=8 HEAD)" = "fb773567"

      - name: Install build prerequisites
        env:
          SKIP_AP_EXT_ENV: '1'
          SKIP_AP_GRAPHIC_ENV: '1'
          SKIP_AP_GIT_CHECK: '1'
        run: upstream/Tools/environment_install/install-prereqs-ubuntu.sh -y

      - name: Apply source changes
        run: |
          python3 tools/patch_dual_esc.py upstream
          sed -i 's/[[:blank:]]*$//' upstream/libraries/AP_OSD/AP_OSD_Screen.cpp upstream/libraries/AP_OSD/AP_OSD.h
          git -C upstream diff --check
          mkdir -p artifacts
          git -C upstream diff > artifacts/dual-esc.patch

      - name: Compile
        shell: bash
        run: |
          source ~/.profile
          cd upstream
          ./waf configure --board Pixhawk1-1M-bdshot
          ./waf rover -j2
          cp build/Pixhawk1-1M-bdshot/bin/ardurover.apj ../artifacts/
          cp build/Pixhawk1-1M-bdshot/bin/ardurover ../artifacts/ardurover.elf

      - name: Validate APJ and record build
        shell: bash
        run: |
          set -euo pipefail

          test -s artifacts/ardurover.apj
          test -s artifacts/ardurover.elf

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/ardurover.apj")

          try:
              apj = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as e:
              raise SystemExit(f"Invalid APJ JSON: {e}")

          required = ("board_id", "image", "image_size", "magic", "format_version")
          missing = [key for key in required if key not in apj]

          if missing:
              raise SystemExit(
                  "Invalid APJ: missing fields: " + ", ".join(missing)
              )

          if not isinstance(apj["image"], str) or not apj["image"]:
              raise SystemExit("Invalid APJ: field 'image' is empty")

          image_size = int(apj["image_size"])
          if image_size <= 0:
              raise SystemExit("Invalid APJ: image_size must be positive")

          print(f"APJ valid: board_id={apj['board_id']}")
          print(f"APJ format_version={apj['format_version']}")
          print(f"APJ image_size={image_size}")
          PY

          git -C upstream rev-parse HEAD > artifacts/upstream-commit.txt
          sha256sum artifacts/ardurover.apj artifacts/ardurover.elf \
            > artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Rover-4.7.2-Pixhawk1-1M-bdshot-dual-ESC
          path: artifacts/
          if-no-files-found: error
